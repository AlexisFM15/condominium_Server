

services:

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: condominio_api_dev
    ports:
      - "${PORT}:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev
    depends_on:
      - postgres
      # - redis
    
  worker:
    build: .
    container_name: worker
    command: pnpm billGenWorker
    depends_on:
      - postgres

  worker2:
    build: .
    container_name: worker2
    command: pnpm billDueWorker
    depends_on:
      - postgres
      
  postgres:
    image: postgres:16
    container_name: condominio_postgres_dev
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "6543:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

#   # redis:
#   #   image: redis:7
#   #   container_name: condominio_redis_dev
#   #   ports:
#   #     - "6377:6377"

volumes:
  postgres_dev_data:
